<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1b1e23;-webkit-text-size-adjust:100%;color:#cdd1da;font-family:'DM Sans',sans-serif;overflow:hidden}
.w{display:flex;height:100vh}
.sb{width:174px;background:#1e2127;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;flex-shrink:0}
.sb-top{padding:10px 12px;flex:1;overflow-y:auto}
.sb-bot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);min-height:120px}
.sh{font-size:.65em;font-weight:600;color:#555b68;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
label{display:flex;align-items:center;gap:5px;font-size:.7em;color:#878d9a;cursor:pointer;margin-bottom:3px;padding:2px 0}
label:hover{color:#cdd1da}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.sl{font-size:.65em;color:#555b68;margin-bottom:1px;margin-top:5px}
input[type=range]{width:100%;accent-color:#e0926a;height:2px;margin:2px 0 4px}
input[type=checkbox]{accent-color:#72c5b4;width:12px;height:12px}
#info{font-size:.7em;color:#555b68;line-height:1.5}
#info .nm{font-weight:600;color:#cdd1da;margin-bottom:1px;font-size:.78em}
#info .tg{color:#e0926a;font-family:'JetBrains Mono',monospace;font-size:.85em;margin-right:3px}
#info .lk{color:#84aed0;font-size:.85em;margin-top:3px}
#info .cam{color:#72c5b4}
#info .bk{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.8em;margin-top:3px}
.mn{flex:1;display:flex;flex-direction:column;position:relative}
.bar{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:5px;align-items:center}
.bar input{flex:1;min-width:100px;padding:5px 9px;border-radius:5px;border:1px solid rgba(255,255,255,.06);background:#15171b;color:#cdd1da;font-size:.78em;font-family:'JetBrains Mono',monospace;outline:none}
.bar input:focus{border-color:#e0926a;box-shadow:0 0 0 1px rgba(224,146,106,.15)}
.cnt{font-size:.65em;color:#555b68;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.chip{font-size:.65em;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.04);color:#878d9a;cursor:pointer;white-space:nowrap;border:1px solid rgba(255,255,255,.06);transition:all .12s;font-family:'JetBrains Mono',monospace}
.chip:hover{background:rgba(224,146,106,.12);color:#e0926a;border-color:rgba(224,146,106,.2)}
.chip.on{background:#e0926a;color:#15171b;border-color:#e0926a;font-weight:600}
.zc{position:absolute;bottom:8px;right:8px;display:flex;gap:3px}
.zb{width:24px;height:24px;border-radius:5px;border:1px solid rgba(255,255,255,.08);background:#1e2127;color:#555b68;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;transition:all .12s}
.zb:hover{background:#2c3038;color:#cdd1da}
.legend{position:absolute;bottom:8px;left:8px;display:flex;gap:8px;font-size:.6em;color:#555b68}
.legend span{display:flex;align-items:center;gap:3px}
svg{flex:1;display:block;cursor:grab;touch-action:none}
svg.grabbing{cursor:grabbing}


/* Tablet */
@media(max-width:768px){
.sb{width:150px}
.sh{font-size:.65em}
label{font-size:.67em}
.sl{font-size:.62em}
#info{font-size:.67em}
.bar input{font-size:.75em}
.chip{font-size:.62em;padding:2px 7px}
.legend{font-size:.55em}
}

/* Mobile landscape + small tablet */
@media(max-width:600px){
.w{flex-direction:column;height:100vh}
.sb{width:100%;border-right:none;border-bottom:1px solid rgba(255,255,255,.06);flex-direction:row;overflow:hidden;height:auto;max-height:none}
.sb-top{flex:1;padding:8px 10px;overflow-y:hidden;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.sb-top .sh{display:none}
.sb-top label{margin-bottom:1px;font-size:.68em}
.sb-top .sl{display:none}
.sb-top input[type=range]{display:none}
.sb-bot{padding:8px 10px;border-top:none;border-left:1px solid rgba(255,255,255,.06);min-height:auto;min-width:120px;max-width:140px}
.sb-bot .sh{font-size:.6em;margin-bottom:3px}
#info{font-size:.65em}
#info .nm{font-size:.72em}
.mn{flex:1;min-height:0}
.bar{padding:5px 8px;gap:4px}
.bar input{font-size:.75em;padding:4px 8px;min-width:80px}
.chip{font-size:.62em;padding:2px 6px;border-radius:6px}
.cnt{font-size:.6em}
.legend{font-size:.52em;gap:4px;bottom:5px;left:5px}
.zc{bottom:5px;right:5px;gap:2px}
.zb{width:26px;height:26px;font-size:12px}
}

/* Mobile portrait */
@media(max-width:480px){
.w{flex-direction:column}
.sb{flex-direction:column;max-height:130px;overflow-y:auto}
.sb-top{padding:6px 8px;gap:6px 12px}
.sb-bot{border-left:none;border-top:1px solid rgba(255,255,255,.06);max-width:100%;min-width:auto;padding:5px 8px}
#info{max-height:50px;overflow-y:auto}
.bar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar input{min-width:100px;flex-shrink:0}
.chip{flex-shrink:0}
.legend span{font-size:.5em}
}

/* Small mobile */
@media(max-width:380px){
.sb{max-height:100px}
.sb-top label{font-size:.62em}
.sb-bot{display:none}
.chip:nth-child(4){display:none}
.bar input{font-size:.7em;padding:3px 6px}
}

/* Force touch targets minimum 44px for mobile */
@media(pointer:coarse){
label{min-height:32px;padding:4px 0}
.chip{min-height:28px;display:flex;align-items:center}
.zb{width:36px;height:36px;font-size:16px}
input[type=checkbox]{width:16px;height:16px}
}

</style>
</head>
<body>
<div class="w">
<div class="sb">
<div class="sb-top">
<div class="sh">Filters</div>
<label><input type="checkbox" checked onchange="gf.camera=this.checked;kick()"><span class="dot" style="background:#72c5b4"></span> Camera</label>
<label><input type="checkbox" checked onchange="gf.temporal=this.checked;kick()"><span class="dot" style="background:#dbb868"></span> Temporal</label>
<label><input type="checkbox" checked onchange="gf.tags=this.checked;kick()"><span class="dot" style="background:#c89ab8"></span> Tags</label>
<label><input type="checkbox" checked onchange="gf.links=this.checked;kick()"><span class="dot" style="background:#84aed0"></span> @links</label>

<div class="sh" style="margin-top:10px">Display</div>
<div class="sl">Node size</div>
<input type="range" min="6" max="28" value="14" oninput="nR=+this.value">
<div class="sl">Energy</div>
<input type="range" min="0" max="100" value="50" oninput="setE(+this.value)" onmousedown="slDrag=true" onmouseup="slDrag=false" onmousedown="slDrag=true" onmouseup="slDrag=false">
</div>
<div class="sb-bot">
<div class="sh">Clip info</div>
<div id="info" style="color:#444">Click a node</div>
</div>
</div>
<div class="mn">
<div class="bar">
<input id="q" type="text" placeholder="#tag  !select  @link  search..." oninput="doSearch(this.value)">
<span class="chip" id="ch1" onclick="cc('#entrevista')">#entrevista</span>
<span class="chip" id="ch2" onclick="cc('maria')">maria</span>
<span class="chip" id="ch3" onclick="cc('!select')">!select</span>
<span class="cnt" id="cnt">10 clips</span>
</div>
<svg id="svg"></svg>
<div class="legend">
<span><span class="dot" style="background:#e0926a"></span> A7S III</span>
<span><span class="dot" style="background:#84aed0"></span> Mavic 3</span>
<span><span class="dot" style="background:#8cc08c"></span> iPhone</span>
<span><span class="dot" style="background:#dbb868"></span> Timelapse</span>
<span style="color:#dbb868">&#9675; !select</span>
<span style="color:#555b68">&#9675; !descarte</span>
</div>
<div class="zc">
<button class="zb" onclick="zoomBy(1.3)">+</button>
<button class="zb" onclick="zoomBy(0.75)">&minus;</button>
<button class="zb" onclick="resetAll()">&#x27F2;</button>
</div>
</div>
</div>
<script>
var N=[
{id:'c01',tp:'clip',l:'Interview_Maria_01',cam:'A7S III',fps:24,dur:'4:32',tc:'01:02:15:00',tags:['#entrevista','#mercado'],bk:'select',x:280,y:175,c:'#e0926a',vx:0,vy:0},
{id:'c02',tp:'clip',l:'Interview_Maria_02',cam:'A7S III',fps:24,dur:'6:10',tc:'01:12:40:00',tags:['#entrevista'],bk:'select',x:330,y:215,c:'#e0926a',vx:0,vy:0},
{id:'c03',tp:'clip',l:'Broll_Market_01',cam:'A7S III',fps:60,dur:'0:48',tc:'02:05:10:00',tags:['#mercado','#broll'],bk:'select',x:195,y:255,c:'#e0926a',vx:0,vy:0},
{id:'c04',tp:'clip',l:'Drone_Market_01',cam:'Mavic 3',fps:60,dur:'1:15',tc:'02:08:30:00',tags:['#mercado','#aerea'],bk:'',x:135,y:178,c:'#84aed0',vx:0,vy:0},
{id:'c05',tp:'clip',l:'Broll_Beach_01',cam:'A7S III',fps:120,dur:'0:35',tc:'03:14:20:00',tags:['#praia','#broll'],bk:'',x:415,y:295,c:'#e0926a',vx:0,vy:0},
{id:'c06',tp:'clip',l:'Drone_Coast_01',cam:'Mavic 3',fps:24,dur:'2:05',tc:'03:18:00:00',tags:['#aerea','#praia'],bk:'select',x:455,y:225,c:'#84aed0',vx:0,vy:0},
{id:'c07',tp:'clip',l:'Interview_Pedro_01',cam:'A7S III',fps:24,dur:'8:22',tc:'01:30:00:00',tags:['#entrevista'],bk:'',x:105,y:108,c:'#e0926a',vx:0,vy:0},
{id:'c08',tp:'clip',l:'Timelapse_Sunset',cam:'A7S III',fps:24,dur:'0:28',tc:'04:00:00:00',tags:['#sunset'],bk:'select',x:505,y:128,c:'#dbb868',vx:0,vy:0},
{id:'c09',tp:'clip',l:'Broll_Street_01',cam:'iPhone 15',fps:30,dur:'0:22',tc:'01:45:00:00',tags:['#rua','#broll'],bk:'descarte',x:65,y:308,c:'#8cc08c',vx:0,vy:0},
{id:'c10',tp:'clip',l:'Drone_City_01',cam:'Mavic 3',fps:60,dur:'1:40',tc:'02:30:00:00',tags:['#aerea','#cidade'],bk:'',x:395,y:98,c:'#84aed0',vx:0,vy:0},
{id:'t1',tp:'theme',l:'A7S III',x:240,y:128,c:'#e0926a',vx:0,vy:0},
{id:'t2',tp:'theme',l:'Mavic 3',x:345,y:168,c:'#84aed0',vx:0,vy:0},
{id:'t3',tp:'theme',l:'#entrevista',x:195,y:148,c:'#c89ab8',vx:0,vy:0},
{id:'t4',tp:'theme',l:'#mercado',x:175,y:218,c:'#72c5b4',vx:0,vy:0},
{id:'t5',tp:'theme',l:'#aerea',x:405,y:158,c:'#dbb868',vx:0,vy:0}
];
var E=[
{f:'c01',t:'c02',tp:'temporal',c:'#dbb868'},
{f:'c03',t:'c04',tp:'temporal',c:'#dbb868'},
{f:'c05',t:'c06',tp:'temporal',c:'#dbb868'},
{f:'c01',t:'t1',tp:'camera',c:'#333'},{f:'c02',t:'t1',tp:'camera',c:'#333'},
{f:'c03',t:'t1',tp:'camera',c:'#333'},{f:'c05',t:'t1',tp:'camera',c:'#333'},
{f:'c07',t:'t1',tp:'camera',c:'#333'},{f:'c08',t:'t1',tp:'camera',c:'#333'},
{f:'c04',t:'t2',tp:'camera',c:'#333'},{f:'c06',t:'t2',tp:'camera',c:'#333'},
{f:'c10',t:'t2',tp:'camera',c:'#333'},
{f:'c01',t:'t3',tp:'tags',c:'#c89ab8'},{f:'c02',t:'t3',tp:'tags',c:'#c89ab8'},
{f:'c07',t:'t3',tp:'tags',c:'#c89ab8'},
{f:'c01',t:'t4',tp:'tags',c:'#72c5b4'},{f:'c03',t:'t4',tp:'tags',c:'#72c5b4'},
{f:'c04',t:'t4',tp:'tags',c:'#72c5b4'},
{f:'c04',t:'t5',tp:'tags',c:'#dbb868'},{f:'c06',t:'t5',tp:'tags',c:'#dbb868'},
{f:'c10',t:'t5',tp:'tags',c:'#dbb868'},
{f:'c03',t:'c05',tp:'links',c:'#84aed0',lb:'@contra-ponto'},
{f:'c01',t:'c07',tp:'links',c:'#84aed0',lb:'@sequencia'},
{f:'c06',t:'c08',tp:'links',c:'#84aed0',lb:'@golden-hour'}
];

var gf={camera:true,temporal:true,tags:true,links:true};
var nR=14,sel=null,qs='',lW=1.5;
var fR=150,fD=0.82,fG=0.0004,fL=0.002;
var vx=0,vy=0,vz=1,panS={on:false},dragN=null,simA=1.2;
var svg,W=560,H=400,slDrag=false;
var vis=new Set(),dh=new Set();

function setE(v){fR=5+v*v*0.15;fD=0.98-v*0.003;fG=0.0001*(100-v)/100;fL=0.0003+v*0.0001;simA=2.0}
function kick(){simA=Math.max(simA,0.8)}

function init(){
  svg=document.getElementById('svg');
  var r=svg.getBoundingClientRect();W=r.width;H=r.height;
  window.addEventListener('resize',function(){var r2=svg.getBoundingClientRect();W=r2.width;H=r2.height});
  svg.addEventListener('wheel',onWh,{passive:false});
  svg.addEventListener('mousedown',onDn);
  window.addEventListener('mousemove',onMv);
  window.addEventListener('mouseup',onUp);
  svg.addEventListener('touchstart',onTS,{passive:false});
  svg.addEventListener('touchmove',onTM,{passive:false});
  svg.addEventListener('touchend',onTE);
  loop();
}

function loop(){if(slDrag)simA=2.0;if(simA>0.001){sim();simA*=0.999}draw();requestAnimationFrame(loop)}

function sim(){
  var a=simA*1.2,cx=280,cy=200,i,j;
  for(i=0;i<N.length;i++){N[i].vx+=(cx-N[i].x)*fG*a;N[i].vy+=(cy-N[i].y)*fG*a}
  for(i=0;i<N.length;i++)for(j=i+1;j<N.length;j++){
    var dx=N[j].x-N[i].x,dy=N[j].y-N[i].y,d2=dx*dx+dy*dy||1,d=Math.sqrt(d2),f=fR/d2*a;
    N[i].vx-=dx/d*f;N[i].vy-=dy/d*f;N[j].vx+=dx/d*f;N[j].vy+=dy/d*f;
  }
  var fe=E.filter(function(e){return gf[e.tp]});
  for(i=0;i<fe.length;i++){
    var e=fe[i],n1=null,n2=null;
    for(j=0;j<N.length;j++){if(N[j].id===e.f)n1=N[j];if(N[j].id===e.t)n2=N[j]}
    if(!n1||!n2)continue;
    var dx=n2.x-n1.x,dy=n2.y-n1.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    var tgt=e.tp==='camera'?85:e.tp==='tags'?65:55;
    var f2=(d-tgt)*fL*a;
    n1.vx+=dx/d*f2;n1.vy+=dy/d*f2;n2.vx-=dx/d*f2;n2.vy-=dy/d*f2;
  }
  for(i=0;i<N.length;i++){if(N[i]===dragN)continue;N[i].vx*=fD;N[i].vy*=fD;N[i].x+=N[i].vx;N[i].y+=N[i].vy}
}

function buildV(){
  vis=new Set();dh=new Set();
  if(!qs)return;
  var q=qs.toLowerCase(),isSelect=q==='select'||q==='!select',isDescarte=q==='descarte'||q==='!descarte';
  for(var i=0;i<N.length;i++){
    var n=N[i],hit=false;
    if(isSelect&&n.bk==='select')hit=true;
    else if(isDescarte&&n.bk==='descarte')hit=true;
    else{
      if(n.l.toLowerCase().indexOf(q)!==-1)hit=true;
      if(n.tags){for(var j=0;j<n.tags.length;j++){if(n.tags[j].replace('#','').toLowerCase().indexOf(q)!==-1){hit=true;break}}}
      if(n.cam&&n.cam.toLowerCase().indexOf(q)!==-1)hit=true;
    }
    if(hit){vis.add(n.id);dh.add(n.id)}
  }
  for(var i=0;i<E.length;i++){if(dh.has(E[i].f))vis.add(E[i].t);if(dh.has(E[i].t))vis.add(E[i].f)}
}

function draw(){
  if(!svg)return;
  var s='',hQ=qs.length>0;
  s+='<g transform="translate('+vx+','+vy+') scale('+vz+')">';
  var fe=E.filter(function(e){return gf[e.tp]});
  for(var i=0;i<fe.length;i++){
    var e=fe[i],a=null,b=null;
    for(var j=0;j<N.length;j++){if(N[j].id===e.f)a=N[j];if(N[j].id===e.t)b=N[j]}
    if(!a||!b)continue;
    var dim=hQ&&(!vis.has(a.id)||!vis.has(b.id));
    var hot=hQ&&dh.has(a.id)&&dh.has(b.id);
    var op=dim?0.015:(hot?0.7:(e.tp==='camera'?0.08:0.25));
    var w=dim?0.2:(hot?2.5:(lW*(e.tp==='links'?1.2:0.6)));
    var col=hot?'#e0926a':(e.tp==='links'?'#84aed0':e.c);
    var da=e.tp==='camera'&&!hot?'stroke-dasharray="3 2"':'';
    s+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+col+'" stroke-width="'+w+'" opacity="'+op+'" '+da+'/>';
    if(e.lb&&!dim){
      var mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,an=Math.atan2(dy,dx)*180/Math.PI;
      if(an>90||an<-90)an+=180;
      s+='<text transform="translate('+mx+','+my+') rotate('+an+')" text-anchor="middle" dy="-4" style="font-family:JetBrains Mono;font-size:7px;fill:'+(hot?'#e0926a':'#555b68')+';pointer-events:none">'+e.lb+'</text>';
    }
  }
  for(var i=0;i<N.length;i++){
    var n=N[i],isT=n.tp==='theme',r=isT?nR*0.45:nR;
    var dim=hQ&&!vis.has(n.id),hit=hQ&&dh.has(n.id);
    var op=dim?0.025:((n.bk==='descarte'&&!hQ)?0.25:1);
    var isSel=sel===n.id;
    // Bookmark rings
    if(n.bk==='select'&&!dim){s+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+(r+4)+'" fill="none" stroke="#dbb868" stroke-width="1.2" opacity="'+(dim?0.05:0.6)+'" stroke-dasharray="4 2"/>';}
    if(n.bk==='descarte'&&!dim){s+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+(r+3)+'" fill="none" stroke="#555b68" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 2"/>';}
    // Selection glow
    if(isSel)s+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+(r+7)+'" fill="none" stroke="'+n.c+'" stroke-width="0.5" opacity="0.5"/>';
    // Search highlight
    if(hit&&!isT)s+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+(r+5)+'" fill="none" stroke="#e0926a" stroke-width="2" opacity="0.85"/>';
    s+='<g opacity="'+op+'" style="cursor:pointer">';
    s+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+(r+5)+'" fill="transparent"/>';
    var sw=isSel?2:(hit?1.5:(isT?0.4:0.7));
    var sc=isSel?'#fff':(hit?'#e0926a':n.c);
    s+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+r+'" fill="'+(isT?'transparent':n.c+(hit?'25':'12'))+'" stroke="'+sc+'" stroke-width="'+sw+'"/>';
    if(!isT){var ir=hit?r*0.45:r*0.35;s+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+ir+'" fill="'+n.c+'" opacity="'+(hit?1:0.8)+'"/>';}
    var tc=dim?'#222':(hit?'#e0926a':(isT?n.c:'#777'));
    var fs=isT?6.5:(hit?8.5:7.5);
    var fw=hit?'font-weight:500;':'';
    s+='<text x="'+n.x+'" y="'+(n.y+r+10)+'" text-anchor="middle" style="font-family:DM Sans;font-size:'+fs+'px;fill:'+tc+';pointer-events:none;'+fw+'">'+n.l+'</text>';
    s+='</g>';
  }
  s+='</g>';
  svg.innerHTML=s;
  if(hQ){var c=0;dh.forEach(function(id){for(var i=0;i<N.length;i++){if(N[i].id===id&&N[i].tp==='clip')c++}});document.getElementById('cnt').textContent=c+'/10'}
  else document.getElementById('cnt').textContent='10 clips';
}

function doSearch(v){
  qs=v.replace(/^[#!]/,'').trim();
  if(v.startsWith('!'))qs=v.replace('!','').trim();
  if(v.toLowerCase()==='!select')qs='select';
  if(v.toLowerCase()==='!descarte')qs='descarte';
  if(v.startsWith('#'))qs=v.replace('#','').trim();
  buildV();
  document.getElementById('ch1').className='chip'+(v==='#entrevista'?' on':'');
  document.getElementById('ch2').className='chip'+(v.toLowerCase()==='maria'?' on':'');
  document.getElementById('ch3').className='chip'+(v==='!select'?' on':'');
}

function cc(v){
  var input=document.getElementById('q');
  if(input.value===v){input.value='';qs='';vis=new Set();dh=new Set();
    document.querySelectorAll('.chip').forEach(function(c){c.className='chip'});
  }else{input.value=v;doSearch(v)}
}

function s2w(sx,sy){var r=svg.getBoundingClientRect();return{x:(sx-r.left-vx)/vz,y:(sy-r.top-vy)/vz}}
function findN(sx,sy){var p=s2w(sx,sy),best=null,bd=999;for(var i=0;i<N.length;i++){var n=N[i],d=Math.sqrt((n.x-p.x)*(n.x-p.x)+(n.y-p.y)*(n.y-p.y)),r2=n.tp==='theme'?nR*0.5+6:nR+6;if(d<r2&&d<bd){best=n;bd=d}};return best}

function onDn(e){e.preventDefault();var n=findN(e.clientX,e.clientY);if(n){dragN=n;selN(n.id);simA=Math.max(simA,0.35)}else{panS={on:true,sx:e.clientX,sy:e.clientY,ox:vx,oy:vy};svg.classList.add('grabbing')}}
function onMv(e){if(dragN){var p=s2w(e.clientX,e.clientY);dragN.x=p.x;dragN.y=p.y;dragN.vx=0;dragN.vy=0}else if(panS.on){vx=panS.ox+(e.clientX-panS.sx);vy=panS.oy+(e.clientY-panS.sy)}}
function onUp(){dragN=null;panS.on=false;svg.classList.remove('grabbing')}
function onWh(e){e.preventDefault();var r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,d=e.deltaY>0?0.85:1.18,nz=Math.max(0.2,Math.min(6,vz*d));vx=mx-(mx-vx)*(nz/vz);vy=my-(my-vy)*(nz/vz);vz=nz}
var lastPinch=0;
function onTS(e){e.preventDefault();
  if(e.touches.length===2){lastPinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);return}
  var t=e.touches[0],n=findN(t.clientX,t.clientY);
  if(n){dragN=n;selN(n.id);simA=Math.max(simA,0.35)}
  else panS={on:true,sx:t.clientX,sy:t.clientY,ox:vx,oy:vy}
}
function onTM(e){e.preventDefault();
  if(e.touches.length===2){
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(lastPinch>0){var f=d/lastPinch;var nz=Math.max(0.2,Math.min(6,vz*f));
      var cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
      var r=svg.getBoundingClientRect();var mx=cx-r.left,my=cy-r.top;
      vx=mx-(mx-vx)*(nz/vz);vy=my-(my-vy)*(nz/vz);vz=nz}
    lastPinch=d;return}
  var t=e.touches[0];
  if(dragN){var p=s2w(t.clientX,t.clientY);dragN.x=p.x;dragN.y=p.y;dragN.vx=0;dragN.vy=0}
  else if(panS.on){vx=panS.ox+(t.clientX-panS.sx);vy=panS.oy+(t.clientY-panS.sy)}
}
function onTE(){dragN=null;panS.on=false;lastPinch=0}
function zoomBy(f){var nz=Math.max(0.2,Math.min(6,vz*f)),cx=W/2,cy=H/2;vx=cx-(cx-vx)*(nz/vz);vy=cy-(cy-vy)*(nz/vz);vz=nz}
function resetAll(){vx=0;vy=0;vz=1;simA=1.2;document.getElementById('q').value='';qs='';vis=new Set();dh=new Set();document.querySelectorAll('.chip').forEach(function(c){c.className='chip'});sel=null;document.getElementById('info').textContent='Click a node'}

function selN(id){
  sel=sel===id?null:id;
  var n=null;for(var i=0;i<N.length;i++){if(N[i].id===id)n=N[i]};
  var info=document.getElementById('info');
  if(n&&sel){
    var h='<div class="nm">'+n.l+'</div>';
    if(n.tc)h+='<div style="font-family:JetBrains Mono;font-size:.85em;color:#555b68">'+n.tc+'</div>';
    if(n.cam)h+='<div>Cam: <span class="cam">'+n.cam+'</span></div>';
    if(n.fps)h+='<div>'+n.fps+'fps · '+n.dur+'</div>';
    if(n.tags)h+='<div style="margin-top:2px">'+n.tags.map(function(t){return'<span class="tg">'+t+'</span>'}).join('')+'</div>';
    if(n.bk==='select')h+='<div class="bk" style="background:rgba(219,184,104,.15);color:#dbb868">!select</div>';
    if(n.bk==='descarte')h+='<div class="bk" style="background:rgba(85,91,104,.15);color:#555b68">!descarte</div>';
    var lk=[];for(var i=0;i<E.length;i++){var e=E[i];if((e.f===id||e.t===id)&&e.lb)lk.push(e)}
    if(lk.length){h+='<div class="lk">';for(var i=0;i<lk.length;i++){var e=lk[i],oid=e.f===id?e.t:e.f,on=null;for(var j=0;j<N.length;j++){if(N[j].id===oid)on=N[j]};if(on)h+=e.lb+' \u2192 '+on.l+'<br>'};h+='</div>'}
    info.innerHTML=h;
  }else info.textContent='Click a node';
}

init();
</script>
</body>
</html>
